# www → dominio principal. Solo aplica si el DNS de www apunta a este origen;
# si no, crea la misma redirección como regla en Cloudflare.
server {
    listen 80;
    listen [::]:80;
    server_name www.jangol.com.co;
    return 301 https://jangol.com.co$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Cloudflare termina TLS y llega por http: las redirecciones (por ejemplo /gyms → /gyms/)
    # deben ser relativas para no mandar al visitante a http://.
    absolute_redirect off;

    # Compresión
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    include /etc/nginx/snippets/security-headers.conf;

    # Assets con hash de Astro: caché inmutable de 1 año
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Imágenes para redes sociales e íconos: cambian poco, caché de 1 día
    location ~* ^/(og/.*|logo|apple-touch-icon|favicon-32)\.png$ {
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Páginas en inglés: su propio 404
    location /en/ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        error_page 404 /en/404/index.html;
        try_files $uri $uri/ =404;
    }

    # HTML: siempre revalidar para que los despliegues se vean al instante
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
